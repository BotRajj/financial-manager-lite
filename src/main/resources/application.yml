spring:
  application:
    name: financial-manager-lite

  # Datasource — Railway injeta DATABASE_URL automaticamente
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/fmlite;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Locale — força pt-BR para formatação de moeda (R$)
  web:
    locale: pt_BR
    locale-resolver: fixed

  # Thymeleaf
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
    encoding: UTF-8

  # H2 console (só em dev local)
  h2:
    console:
      enabled: ${H2_CONSOLE:true}
      path: /h2-console

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  security:
    remember-me-key: ${REMEMBER_ME_KEY:dev-remember-me-key-change-in-production}

logging:
  level:
    root: WARN
    com.financialmanager: INFO

---
# Perfil PostgreSQL (Railway / produção)
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  h2:
    console:
      enabled: false

  thymeleaf:
    cache: true
